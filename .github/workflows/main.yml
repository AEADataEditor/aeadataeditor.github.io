# Build and (conditionally) publish to gh-pages
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby
#
# The site is always built - on pushes to main, on pull requests, and on
# manual runs - and the rendered _site is uploaded as a downloadable
# workflow artifact. Publishing to gh-pages only happens on pushes to main,
# or on a manual run with the "publish" option checked.

name: Build website

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to gh-pages'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Ruby
    # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
    # change this to (see https://github.com/ruby/setup-ruby#versioning):
    # uses: ruby/setup-ruby@v1
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.4
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Build Jekyll website
      run: |
        set -xo pipefail
        rm -rf _site/*
        gem install bundler -v 2.6.3
        bundle install
        bundle exec jekyll build
    - name: Generate agent instruction file
      run: python3 .github/scripts/generate_agent_md.py
    - name: Upload site artifact
      uses: actions/upload-artifact@v4
      with:
        name: site
        path: _site
        retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
    - name: Download site artifact
      uses: actions/download-artifact@v4
      with:
        name: site
        path: _site
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
         github_token:  ${{ secrets.GITHUB_TOKEN }}
         publish_dir: _site
         user_name: 'Github Action Bot'
         user_email: 'lars.vilhuber@cornell.edu'
         publish_branch: gh-pages
         keep_files: false
